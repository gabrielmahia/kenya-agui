[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "kenya-agui"
version = "0.1.0"
description = "First East African AG-UI implementation — connects civic AI agents to live frontends"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [{name = "Gabriel Mahia", email = "contact@aikungfu.dev"}]
keywords = ["ag-ui", "east-africa", "kenya", "civic-tech", "ai-agents", "protocol"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
]

[project.optional-dependencies]
mpesa = ["mpesa-mcp>=0.1.9"]
wapimaji = ["wapimaji-mcp>=0.1.0"]
full = ["mpesa-mcp>=0.1.9", "wapimaji-mcp>=0.1.0"]
dev = ["pytest>=8", "ruff>=0.4", "httpx"]

[project.urls]
Homepage = "https://github.com/gabrielmahia/kenya-agui"
Repository = "https://github.com/gabrielmahia/kenya-agui"
"AG-UI Protocol" = "https://github.com/ag-ui-protocol/ag-ui"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
